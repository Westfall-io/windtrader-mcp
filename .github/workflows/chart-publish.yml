name: Publish Helm Chart to GHCR

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_DIR: deploy/charts/windtrader-mcp
  # Chart package name and org/repo target.
  # NOTE: OCI/registry references must be ALL LOWERCASE or helm push fails
  # with "invalid_reference: invalid repository" (Docker/OCI path rules).
  CHART_NAME: windtrader-mcp
  CHART_REPO: westfall-io/windtrader-mcp

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push the chart OCI artifact to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Package chart
        run: |
          helm package "$CHART_DIR" --destination dist/
          ls -la dist/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR as OCI artifact
        run: |
          chart_file="dist/$(ls dist/ | head -1)"
          echo "Pushing ${chart_file} to ${REGISTRY}/${CHART_REPO}"
          helm push "${chart_file}" "oci://${REGISTRY}/${CHART_REPO}"
