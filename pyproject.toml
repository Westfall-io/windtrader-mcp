[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "windtrader-mcp"
version = "0.2.0"
description = "MCP server that wraps WindTrader to validate SysMLv2 syntax."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "WindTrader" }
]
keywords = ["mcp", "model-context-protocol", "sysmlv2", "windtrader"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/Westfall-io/windtrader-mcp"
Issues = "https://github.com/Westfall-io/windtrader-mcp/issues"

[project.scripts]
windtrader-mcp = "windtrader_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/windtrader_mcp"]
